<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Barlow Condensed, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#111620"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5568"/>
      <stop offset="50%" style="stop-color:#718096"/>
      <stop offset="100%" style="stop-color:#2D3748"/>
    </linearGradient>
    <linearGradient id="catalystBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748"/>
      <stop offset="50%" style="stop-color:#4A5568"/>
      <stop offset="100%" style="stop-color:#1A202C"/>
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#744210"/>
      <stop offset="50%" style="stop-color:#975A16"/>
      <stop offset="100%" style="stop-color:#744210"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#CC1020"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4299E1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#48BB78"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)" rx="8"/>
  <rect width="800" height="420" fill="none" stroke="#232B3A" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="2" text-transform="uppercase">CONVERSOR CATALÍTICO — DIAGRAMA TÉCNICO</text>
  <line x1="120" y1="40" x2="680" y2="40" stroke="#CC1020" stroke-width="1" opacity="0.5"/>

  <!-- LEFT PIPE (inlet - dirty gases) -->
  <rect x="30" y="165" width="140" height="40" fill="url(#pipeGrad)" rx="4"/>
  <rect x="30" y="165" width="140" height="4" fill="#718096" rx="2"/>
  <!-- Flange -->
  <rect x="162" y="155" width="18" height="60" fill="#4A5568" rx="2"/>

  <!-- RIGHT PIPE (outlet - clean gases) -->
  <rect x="630" y="165" width="140" height="40" fill="url(#pipeGrad)" rx="4"/>
  <rect x="630" y="165" width="140" height="4" fill="#718096" rx="2"/>
  <!-- Flange -->
  <rect x="620" y="155" width="18" height="60" fill="#4A5568" rx="2"/>

  <!-- CATALYST BODY (main housing) -->
  <rect x="178" y="120" width="444" height="130" fill="url(#catalystBody)" rx="12"/>
  <rect x="178" y="120" width="444" height="130" fill="none" stroke="#4A5568" stroke-width="2" rx="12"/>
  <!-- Top shine -->
  <rect x="182" y="124" width="436" height="6" fill="#718096" opacity="0.3" rx="3"/>

  <!-- CERAMIC SUBSTRATE (honeycomb channels) -->
  <rect x="220" y="135" width="360" height="100" fill="#1A202C" rx="4"/>
  <!-- Honeycomb grid lines - vertical -->
  <g stroke="#975A16" stroke-width="0.8" opacity="0.7">
    <line x1="240" y1="135" x2="240" y2="235"/>
    <line x1="260" y1="135" x2="260" y2="235"/>
    <line x1="280" y1="135" x2="280" y2="235"/>
    <line x1="300" y1="135" x2="300" y2="235"/>
    <line x1="320" y1="135" x2="320" y2="235"/>
    <line x1="340" y1="135" x2="340" y2="235"/>
    <line x1="360" y1="135" x2="360" y2="235"/>
    <line x1="380" y1="135" x2="380" y2="235"/>
    <line x1="400" y1="135" x2="400" y2="235"/>
    <line x1="420" y1="135" x2="420" y2="235"/>
    <line x1="440" y1="135" x2="440" y2="235"/>
    <line x1="460" y1="135" x2="460" y2="235"/>
    <line x1="480" y1="135" x2="480" y2="235"/>
    <line x1="500" y1="135" x2="500" y2="235"/>
    <line x1="520" y1="135" x2="520" y2="235"/>
    <line x1="540" y1="135" x2="540" y2="235"/>
    <line x1="556" y1="135" x2="556" y2="235"/>
    <line x1="572" y1="135" x2="572" y2="235"/>
  </g>
  <!-- Horizontal -->
  <g stroke="#975A16" stroke-width="0.8" opacity="0.7">
    <line x1="220" y1="150" x2="580" y2="150"/>
    <line x1="220" y1="165" x2="580" y2="165"/>
    <line x1="220" y1="180" x2="580" y2="180"/>
    <line x1="220" y1="195" x2="580" y2="195"/>
    <line x1="220" y1="210" x2="580" y2="210"/>
    <line x1="220" y1="225" x2="580" y2="225"/>
  </g>
  <!-- Substrate label -->
  <text x="400" y="183" text-anchor="middle" fill="#D69E2E" font-size="11" font-weight="700" letter-spacing="1">SUBSTRATO CERÂMICO</text>
  <text x="400" y="197" text-anchor="middle" fill="#B7791F" font-size="9.5">Revestido com Platina · Paládio · Ródio</text>

  <!-- Lambda sensor left -->
  <rect x="196" y="107" width="10" height="28" fill="#718096" rx="2"/>
  <text x="201" y="100" text-anchor="middle" fill="#A0AEC0" font-size="9">λ</text>

  <!-- Lambda sensor right -->
  <rect x="594" y="107" width="10" height="28" fill="#718096" rx="2"/>
  <text x="599" y="100" text-anchor="middle" fill="#A0AEC0" font-size="9">λ</text>

  <!-- DIRTY GAS FLOW ARROWS (left, red) -->
  <g filter="url(#glow)">
    <line x1="45" y1="178" x2="100" y2="178" stroke="#CC1020" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <line x1="55" y1="185" x2="90" y2="185" stroke="#CC1020" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow-red)"/>
    <line x1="55" y1="171" x2="90" y2="171" stroke="#CC1020" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow-red)"/>
  </g>

  <!-- CLEAN GAS FLOW ARROWS (right, green) -->
  <g filter="url(#glow)">
    <line x1="690" y1="178" x2="745" y2="178" stroke="#48BB78" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <line x1="700" y1="185" x2="740" y2="185" stroke="#48BB78" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow-green)"/>
    <line x1="700" y1="171" x2="740" y2="171" stroke="#48BB78" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow-green)"/>
  </g>

  <!-- REACTION LABEL inside substrate -->
  <rect x="290" y="205" width="220" height="22" fill="rgba(0,0,0,0.5)" rx="3"/>
  <text x="400" y="220" text-anchor="middle" fill="#68D391" font-size="10" font-weight="600">CO + HC + NOx → CO₂ + H₂O + N₂</text>

  <!-- LABELS BELOW -->
  <!-- Inlet label -->
  <rect x="20" y="270" width="160" height="54" fill="#1A202C" rx="6" stroke="#CC1020" stroke-width="1"/>
  <text x="100" y="289" text-anchor="middle" fill="#CC1020" font-size="11" font-weight="700" letter-spacing="1">GASES NOCIVOS</text>
  <text x="100" y="303" text-anchor="middle" fill="#A0AEC0" font-size="9.5">CO · HC · NOx</text>
  <text x="100" y="316" text-anchor="middle" fill="#718096" font-size="9">Monóxido · Hidrocarbonetos</text>

  <!-- Catalyst label -->
  <rect x="240" y="270" width="320" height="54" fill="#1A202C" rx="6" stroke="#003F8A" stroke-width="1"/>
  <text x="400" y="289" text-anchor="middle" fill="#63B3ED" font-size="11" font-weight="700" letter-spacing="1">REAÇÃO CATALÍTICA</text>
  <text x="400" y="304" text-anchor="middle" fill="#A0AEC0" font-size="9.5">Temperatura: 400°C – 800°C</text>
  <text x="400" y="317" text-anchor="middle" fill="#718096" font-size="9">Eficiência de conversão: até 98%</text>

  <!-- Outlet label -->
  <rect x="620" y="270" width="160" height="54" fill="#1A202C" rx="6" stroke="#48BB78" stroke-width="1"/>
  <text x="700" y="289" text-anchor="middle" fill="#48BB78" font-size="11" font-weight="700" letter-spacing="1">GASES LIMPOS</text>
  <text x="700" y="303" text-anchor="middle" fill="#A0AEC0" font-size="9.5">CO₂ · H₂O · N₂</text>
  <text x="700" y="316" text-anchor="middle" fill="#718096" font-size="9">Dióxido · Água · Nitrogênio</text>

  <!-- Connector lines -->
  <line x1="100" y1="255" x2="100" y2="270" stroke="#CC1020" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="400" y1="250" x2="400" y2="270" stroke="#003F8A" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="700" y1="255" x2="700" y2="270" stroke="#48BB78" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Flow direction arrows between boxes -->
  <line x1="182" y1="297" x2="238" y2="297" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="562" y1="297" x2="618" y2="297" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Bottom footnote -->
  <text x="400" y="395" text-anchor="middle" fill="#4A5568" font-size="9" letter-spacing="1">BAND SCAP ESCAPAMENTOS · Catalisadores Originais · Vila Ema, São Paulo</text>
</svg>